
name: Build Quran APK

on:
  workflow_dispatch:
  push:
    paths:
      - "QuranSakina-Android-Project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o QuranSakina-Android-Project.zip -d project
          find project -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd project
          DIR=$(find . -name gradlew -type f | head -1 | xargs dirname)
          if [ -z "$DIR" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Sakina-APK
          path: project/**/*.apk
          if-no-files-found: error
